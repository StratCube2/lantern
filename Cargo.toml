[package]
name = "lantern-practice"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Internal Pumpkin crates aren't on crates.io yet — pulled straight from git.
pumpkin-plugin-api = { version = "0.1.0", git = "https://github.com/Pumpkin-MC/Pumpkin", package = "pumpkin-plugin-api" }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = true
