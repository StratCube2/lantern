name: WASM Plugin Nightly Build (tag: build1)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  WASM_TARGET: "wasm32-wasip2"

jobs:
  build-and-release:
    name: Build WASM Plugin and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Stable & WASI p2 Target
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ env.WASM_TARGET }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build WASM Plugin Release
        run: |
          cargo build --target ${{ env.WASM_TARGET }} --release

      - name: Stage Release Artifacts
        run: |
          mkdir -p dist
          # Copies all compiled .wasm binaries from the target release folder
          cp target/${{ env.WASM_TARGET }}/release/*.wasm dist/

      - name: Publish / Update Release (tag: build1)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build1
          name: "WASM Plugin Build 1 (${{ github.sha }})"
          body: |
            Automated WASM Plugin Build (`wasm32-wasip2`).
            
            **Commit SHA:** `${{ github.sha }}`
            **Built at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          prerelease: true
          draft: false
          files: dist/*.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
